<!doctype html>
<html lang="{{ site.lang | default: 'vi' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff6eb">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}"><span>better</span><em>and</em><span>better</span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav"><span></span><span></span><span></span><b class="sr-only">Mở menu</b></button>
      <nav id="main-nav" class="main-nav" aria-label="Điều hướng chính">
        <a href="{{ '/' | relative_url }}">Trang chủ</a>
        <a href="{{ '/hoan-thanh/' | relative_url }}">Đã hoàn thành</a>
        <a href="{{ '/dang-viet/' | relative_url }}">Đang viết</a>
        <a href="{{ '/password/' | relative_url }}">Password</a>
        <a href="{{ '/goc-nho/' | relative_url }}">Góc nhỏ</a>
      </nav>
      <div class="header-tools">
        <button class="icon-button search-button" aria-label="Tìm trong blog" aria-controls="search-dialog">⌕</button>
        <button class="icon-button theme-toggle" aria-label="Đổi giao diện" title="Đổi giao diện">☾</button>
      </div>
    </header>
    <main class="site-shell">{{ content }}</main>
    <footer class="site-footer">
      <div class="footer-branch" aria-hidden="true">✿</div>
      <div><p class="footer-label">Gửi một lời thương</p><div class="socials"><a href="#" aria-label="Facebook">f</a><a href="#" aria-label="WordPress">w</a><a href="#" aria-label="Wattpad">W</a></div></div>
      <p class="visitor">☼ <span id="visitor-count">01,526</span><small>lượt ghé thăm</small></p>
      <p class="copyright">© {{ 'now' | date: '%Y' }} Mellifluous<br>made with little summer things</p>
    </footer>
    <dialog id="search-dialog" class="search-dialog"><button class="dialog-close" aria-label="Đóng">×</button><p class="eyebrow">tìm trong khu vườn nhỏ</p><h2>Bạn đang tìm điều gì?</h2><input id="search-input" type="search" placeholder="Gõ tên truyện hoặc bài viết…" autocomplete="off"><div id="search-results" aria-live="polite"></div></dialog>
    <script type="application/json" id="search-data">[{% for post in site.posts %}{"title":{{ post.title | jsonify }},"url":{{ post.url | relative_url | jsonify }},"date":{{ post.date | date: '%d.%m.%Y' | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
  </body>
</html>
